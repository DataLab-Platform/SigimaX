# SigimaX setup configuration file

[project]
name = "sigimax"
authors = [{ name = "Pierre Raybaut", email = "p.raybaut@codra.fr" }]
maintainers = [
    { name = "DataLab Platform Developers", email = "datalab@codra.fr" },
]
description = "Reusable GUI components and application utilities, part of the DataLab platform for signal and image processing"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 7",
    "Operating System :: Microsoft :: Windows :: Windows 8",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Widget Sets",
]
requires-python = ">=3.9, <4"
dependencies = [
    "guidata >= 3.13.4",
    "PlotPy >= 2.8.2",
    "psutil >= 5.7",
    "Sigima >= 1.1.0",
]
dynamic = ["version"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://datalab-platform.com/"
Documentation = "https://datalab-platform.com/"

[project.optional-dependencies]
qt = ["PyQt5 >= 5.15.6"]
opencv = ["opencv-python-headless >= 4.5"]
dev = ["ruff", "pylint", "Coverage"]
doc = [
    "sphinx",
    "sphinx_intl",
    "sphinx-sitemap",
    "myst_parser",
    "myst-nb",
    "sphinx_design",
    "sphinx_gallery",
    "sphinx-copybutton",
    "pydata-sphinx-theme",
]
test = ["pytest", "pytest-xvfb"]

[tool.setuptools.packages.find]
include = ["sigimax*"]

[tool.setuptools.package-data]
"*" = [
    "*.pdf",
    "*.png",
    "*.svg",
    "*.mo",
    "*.txt",
    "*.json",
    "*_test.h5",
    "*.npy",
    "*.dcm",
    "*.scor-data",
    "*.tiff",
    "*.jpg",
    "*.sif",
    "*.csv",
    "*.mat",
    "*.js",
    "*.css",
    "*.html",
    "*.buildinfo",
    "*.inv",
]

[tool.setuptools.dynamic]
version = { attr = "sigimax._metadata.__version__" }

[tool.pytest.ini_options]
addopts = "sigimax --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning:pandas.*",
    "ignore::DeprecationWarning:scipy.*",
    "ignore::DeprecationWarning:skimage.*",
]

[tool.ruff]
exclude = [".git", ".vscode", "build", "dist", "*.ipynb"]
line-length = 88                               # Same as Black.
indent-width = 4                               # Same as Black.
target-version = "py39"                        # Assume Python 3.9.

[tool.ruff.lint]
# all rules can be found here: https://beta.ruff.rs/docs/rules/
select = ["D202", "D403", "E", "F", "I", "NPY201", "RUF022", "W"]
ignore = [
    "E203", # space before : (needed for how black formats slicing)
]

[tool.ruff.format]
quote-style = "double"            # Like Black, use double quotes for strings.
indent-style = "space"            # Like Black, indent with spaces, rather than tabs.
skip-magic-trailing-comma = false # Like Black, respect magic trailing commas.
line-ending = "auto"              # Like Black, automatically detect the appropriate line ending.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"doc/*" = ["E402"]
